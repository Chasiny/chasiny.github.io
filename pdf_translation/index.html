<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 论文对照阅读器 (最终稳定版)</title>
    
    <!-- 依赖库加载 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/lucide@0.344.0"></script>

    <style>
        body { background-color: #f3f4f6; height: 100vh; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
        
        .page-container {
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            margin-bottom: 2rem;
            background: white;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        canvas { display: block; }

        .translation-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        .translated-block {
            position: absolute;
            color: #111827; 
            background: #ffffff; 
            line-height: 1.5;
            padding: 4px 8px;
            pointer-events: auto;
            display: block;
            overflow: hidden;
            text-align: justify;
            font-weight: 400;
            border-radius: 0px;
            word-break: break-word;
            white-space: normal;
            z-index: 5;
            transition: background-color 0.2s;
            border: none;
            outline: none;
        }
        
        .translated-block:hover {
            background: #fafafa;
            z-index: 10;
            cursor: pointer;
        }

        .text-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            line-height: 1;
            opacity: 0.1;
        }
        .text-layer span {
            color: transparent;
            position: absolute;
            white-space: pre;
            cursor: text;
            transform-origin: 0% 0%;
        }

        .loader {
            border: 2px solid #f3f3f3;
            border-radius: 50%;
            border-top: 2px solid #3b82f6;
            width: 14px; height: 14px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // 初始化 PDF.js Worker
        if (typeof window !== 'undefined' && window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        // 翻译接口 (Google Translate API 镜像)
        async function translateText(text) {
            if (!text || text.trim().length === 0) return "";
            try {
                const response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q=${encodeURIComponent(text)}`);
                const data = await response.json();
                return data[0].map(item => item[0]).join('');
            } catch (e) {
                return text;
            }
        }

        const Icon = ({ name, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && typeof lucide !== 'undefined') {
                    iconRef.current.innerHTML = '';
                    const iconElement = document.createElement('i');
                    iconElement.setAttribute('data-lucide', name);
                    if (className) iconElement.className = className;
                    iconRef.current.appendChild(iconElement);
                    lucide.createIcons({ icons: lucide.icons });
                }
            }, [name, className]);
            return <span ref={iconRef} className="inline-flex items-center" />;
        };

        const PdfPage = ({ page, scale, isTranslationMode, onTextSelect }) => {
            const canvasRef = useRef(null);
            const textLayerRef = useRef(null);
            const [translatedBlocks, setTranslatedBlocks] = useState([]);
            const [isTranslating, setIsTranslating] = useState(false);
            const [viewport, setViewport] = useState(null);

            useEffect(() => {
                const renderPage = async () => {
                    if (!page || !canvasRef.current) return;
                    const vp = page.getViewport({ scale });
                    setViewport(vp);
                    
                    const canvas = canvasRef.current;
                    const context = canvas.getContext('2d');
                    canvas.height = vp.height;
                    canvas.width = vp.width;
                    await page.render({ canvasContext: context, viewport: vp }).promise;

                    if (textLayerRef.current) {
                        textLayerRef.current.innerHTML = '';
                        textLayerRef.current.style.setProperty('--scale-factor', vp.scale);
                        
                        const textContent = await page.getTextContent();
                        window.pdfjsLib.renderTextLayer({
                            textContent,
                            container: textLayerRef.current,
                            viewport: vp,
                            textDivs: []
                        });
                    }

                    if (isTranslationMode && translatedBlocks.length === 0) {
                        performParagraphTranslation(page, vp, scale);
                    }
                };
                renderPage();
            }, [page, scale, isTranslationMode]);

            const performParagraphTranslation = async (pdfPage, vp, currentScale) => {
                setIsTranslating(true);
                try {
                    const textContent = await pdfPage.getTextContent();
                    const items = textContent.items;
                    if (!items.length) return;

                    const paragraphs = [];
                    let currentPara = null;

                    items.forEach((item) => {
                        if (!item.str.trim()) return;
                        const tx = window.pdfjsLib.Util.transform(vp.transform, item.transform);
                        const fontSize = Math.sqrt(item.transform[0]**2 + item.transform[1]**2); 
                        const x = tx[4], y = tx[5];
                        
                        if (!currentPara || Math.abs(y - currentPara.lastY) > fontSize * 1.8) {
                            if (currentPara) paragraphs.push(currentPara);
                            currentPara = {
                                rawText: item.str,
                                minX: x, maxX: x + item.width * currentScale,
                                minY: y - fontSize, maxY: y,
                                lastY: y, fontSize: fontSize
                            };
                        } else {
                            currentPara.rawText += " " + item.str;
                            currentPara.maxX = Math.max(currentPara.maxX, x + item.width * currentScale);
                            currentPara.minY = Math.min(currentPara.minY, y - fontSize);
                            currentPara.maxY = Math.max(currentPara.maxY, y);
                            currentPara.lastY = y;
                        }
                    });
                    if (currentPara) paragraphs.push(currentPara);

                    const results = await Promise.all(paragraphs.filter(p => p.rawText.trim().length > 2).slice(0, 25).map(async (para) => {
                        const cnText = await translateText(para.rawText);
                        return {
                            id: Math.random(),
                            text: cnText,
                            rawLeft: para.minX / currentScale,
                            rawTop: para.minY / currentScale,
                            rawWidth: (para.maxX - para.minX) / currentScale,
                            rawHeight: (para.maxY - para.minY) / currentScale,
                            rawFontSize: (para.fontSize / currentScale)
                        };
                    }));
                    setTranslatedBlocks(results);
                } catch (e) { console.error(e); } finally { setIsTranslating(false); }
            };

            return (
                <div 
                    className="page-container" 
                    style={{ width: viewport?.width, height: viewport?.height }}
                    onMouseUp={() => {
                        const sel = window.getSelection();
                        const text = sel.toString().trim();
                        if (text) onTextSelect(text, sel.getRangeAt(0).getBoundingClientRect());
                    }}
                >
                    <canvas ref={canvasRef} />
                    <div ref={textLayerRef} className="text-layer" />
                    
                    {isTranslationMode && (
                        <div className="translation-layer">
                            {translatedBlocks.map(block => (
                                <div key={block.id} className="translated-block"
                                    style={{
                                        left: (block.rawLeft * scale) - 6, 
                                        top: (block.rawTop * scale) - 2,
                                        width: (block.rawWidth * scale) + 16, 
                                        minHeight: (block.rawHeight * scale) + 4,
                                        fontSize: `${Math.max(block.rawFontSize * scale * 0.9, 10)}px`
                                    }}
                                >
                                    {block.text}
                                </div>
                            ))}
                            {isTranslating && (
                                <div className="absolute top-4 right-4 bg-white/90 px-3 py-1 rounded-full shadow text-[10px] flex items-center gap-2">
                                    <div className="loader"></div> 正在翻译...
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [pages, setPages] = useState([]);
            const [scale, setScale] = useState(1.2);
            const [selectionInfo, setSelectionInfo] = useState(null);
            
            const leftRef = useRef(null);
            const rightRef = useRef(null);

            const handleTextSelect = useCallback(async (text, rect) => {
                setSelectionInfo({ text, rect, translation: "翻译中...", loading: true });
                const translated = await translateText(text);
                setSelectionInfo(prev => ({ ...prev, translation: translated, loading: false }));
            }, []);

            const handleFileChange = async (e) => {
                const f = e.target.files[0];
                if (!f) return;
                const data = await f.arrayBuffer();
                const pdf = await window.pdfjsLib.getDocument({ data }).promise;
                const loaded = [];
                for (let i = 1; i <= Math.min(pdf.numPages, 10); i++) loaded.push(await pdf.getPage(i));
                setPages(loaded);
            };

            const syncScroll = (e) => {
                const source = e.target;
                const target = source === leftRef.current ? rightRef.current : leftRef.current;
                if (target) {
                    const ratio = source.scrollTop / (source.scrollHeight - source.clientHeight);
                    target.scrollTop = ratio * (target.scrollHeight - target.clientHeight);
                }
            };

            useEffect(() => {
                const hide = () => setSelectionInfo(null);
                const handleMouseDown = (e) => { if (!e.target.closest('.tooltip')) hide(); };
                window.addEventListener('mousedown', handleMouseDown);
                return () => window.removeEventListener('mousedown', handleMouseDown);
            }, []);

            return (
                <div className="flex flex-col h-screen bg-gray-100">
                    <header className="bg-white border-b px-6 py-3 flex justify-between items-center z-30 shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 text-white p-2 rounded-lg shadow-sm"><Icon name="languages" /></div>
                            <h1 className="font-bold text-gray-800 tracking-tight">学术对照阅读器</h1>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="flex bg-gray-100 rounded-md p-1 items-center gap-2">
                                <button onClick={() => setScale(s => Math.max(0.5, s - 0.1))} className="px-2 font-bold hover:bg-white rounded transition-colors">-</button>
                                <span className="text-xs w-12 text-center font-mono">{Math.round(scale*100)}%</span>
                                <button onClick={() => setScale(s => Math.min(3, s + 0.1))} className="px-2 font-bold hover:bg-white rounded transition-colors">+</button>
                            </div>
                            <label className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-sm cursor-pointer transition-all active:scale-95 font-medium shadow-md">
                                导入 PDF
                                <input type="file" accept=".pdf" onChange={handleFileChange} className="hidden" />
                            </label>
                        </div>
                    </header>

                    <main className="flex-1 flex overflow-hidden">
                        {/* 左侧原文区：居右对齐 */}
                        <div ref={leftRef} onScroll={syncScroll} className="w-1/2 overflow-y-auto flex flex-col items-end pt-8 pb-12 pr-4 pl-12 bg-gray-200/40">
                            {pages.map((p, i) => <PdfPage key={`l-${i}`} page={p} scale={scale} isTranslationMode={false} onTextSelect={handleTextSelect} />)}
                        </div>
                        {/* 右侧翻译区：居左对齐 */}
                        <div ref={rightRef} onScroll={syncScroll} className="w-1/2 overflow-y-auto flex flex-col items-start pt-8 pb-12 pl-4 pr-12 bg-gray-50 border-l border-gray-200">
                            {pages.map((p, i) => <PdfPage key={`r-${i}`} page={p} scale={scale} isTranslationMode={true} />)}
                        </div>
                    </main>

                    {selectionInfo && (
                        <div className="tooltip fixed z-[100] bg-white rounded-xl shadow-2xl border border-gray-100 w-80 overflow-hidden"
                            style={{ left: Math.min(selectionInfo.rect.left, window.innerWidth - 340), top: selectionInfo.rect.bottom + 10 }}>
                            <div className="p-3 bg-gray-50 text-[10px] text-gray-400 border-b flex justify-between">
                                <span>选中文本翻译</span>
                                {selectionInfo.loading && <div className="loader"></div>}
                            </div>
                            <div className="p-4 text-sm text-gray-800 leading-relaxed font-medium">
                                {selectionInfo.translation}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
